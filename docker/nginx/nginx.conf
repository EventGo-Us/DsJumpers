# nginx runs as www-data (container USER): every writable path lives in /tmp.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    # Client IP from the ALB (VPC CIDRs are 10.x)
    set_real_ip_from 10.0.0.0/8;
    real_ip_header   X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    '$request_time "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    # Behind the ALB the container port (8080) must never leak into redirects
    absolute_redirect off;
    port_in_redirect  off;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml;

    # TLS terminates at the ALB; tell PHP when the original request was HTTPS
    map $http_x_forwarded_proto $fe_https {
        https   on;
        default "";
    }

    upstream php {
        server 127.0.0.1:9000;
    }

    server {
        listen 8080 default_server;
        root   /var/www/html;
        index  index.php;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---------------------------------------------------------------
        # Health check (ALB + ECS): nginx -> php-fpm ping
        # ---------------------------------------------------------------
        location = /healthz {
            access_log off;
            include fastcgi_params;
            fastcgi_param SCRIPT_NAME     /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_pass php;
        }

        # ---------------------------------------------------------------
        # Never served: secrets, dependencies, config, internals
        # ---------------------------------------------------------------
        location ~ /\.(?!well-known/) { return 404; }
        location ~ ^/(vendor|config|remove|docker)/ { return 404; }
        location ~ ^/(composer\.(json|lock)|Dockerfile|AGENTS\.md)$ { return 404; }
        location ~ \.json$ { return 404; }

        # Uploaded files are data: never execute PHP from the upload dir
        location ^~ /ajax/tmp/ {
            location ~ \.php$ { return 404; }
            try_files $uri =404;
        }

        # ---------------------------------------------------------------
        # Front controllers (were api/.htaccess and api-web/.htaccess)
        # ---------------------------------------------------------------
        location ^~ /api/ {
            try_files $uri $uri/ /api/index.php?$query_string;
            location ~ \.php$ { include /etc/nginx/php_fastcgi.conf; }
        }

        location ^~ /api-web/ {
            try_files $uri $uri/ /api-web/index.php?$query_string;
            location ~ \.php$ { include /etc/nginx/php_fastcgi.conf; }
        }

        # ---------------------------------------------------------------
        # Company routing (was the root .htaccess)
        # ---------------------------------------------------------------
        location = /login { return 302 /error_instancia.php; }

        location ~ ^/([^/]+)/login$ {
            rewrite ^/([^/]+)/login$ /index.php?company=$1 last;
        }

        # ---------------------------------------------------------------
        # PHP + static files
        # ---------------------------------------------------------------
        location ~ \.php$ {
            include /etc/nginx/php_fastcgi.conf;
        }

        location ~* \.(css|js|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf)$ {
            expires 7d;
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
