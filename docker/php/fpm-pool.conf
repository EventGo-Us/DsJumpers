; Replaces the image's www.conf and zz-docker.conf.
; The master runs as www-data (container USER), so user/group are not set.

[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; /healthz in nginx is routed here: proves nginx -> php-fpm works end to end
ping.path = /fpm-ping
ping.response = pong

; Access logs come from nginx; keep worker stderr (PHP warnings) in the log
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no

; App config comes from .env, not from the process environment
clear_env = yes
