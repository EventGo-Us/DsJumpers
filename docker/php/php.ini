; Overrides on top of php.ini-production

expose_php = Off
date.timezone = America/Mexico_City

memory_limit = 256M
max_execution_time = 120
upload_max_filesize = 20M
post_max_size = 25M

; Errors go to the container log, never to the browser
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; File-based sessions on the task's local disk (ALB stickiness is on)
session.save_path = /tmp/php-sessions
session.cookie_httponly = 1
session.use_strict_mode = 1

; The code is immutable inside the image: no need to stat files on each request
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
